name: Deploy HomeBase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Rust scorer build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: scorer

      - name: Build Rust scorer
        run: cargo build --release --manifest-path scorer/Cargo.toml

      - name: Run scorer
        run: ./scorer/target/release/homebase-scorer --in data/listings.json --out data/scored.json --weights scorer/weights.json

      - name: Sync scored data into app bundle
        run: cp data/scored.json src/data/scored.json

      - name: Commit regenerated scored data
        run: |
          if git diff --quiet -- data/scored.json; then
            echo "scored.json unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/scored.json
            git commit -m "chore: regenerate scored data [skip ci]"
            git push
          fi

      - name: Build site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
